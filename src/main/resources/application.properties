# Spring Boot Server Configuration
server.port=8000
server.servlet.context-path=/

# Application Name
spring.application.name=speak2hr-backend

# MongoDB Configuration (Fast timeout fallback when offline)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/speak2hr?serverSelectionTimeoutMS=1000&connectTimeoutMS=1000}
spring.data.mongodb.auto-index-creation=false

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}

# Google Gemini API Keys
gemini.api.key=${GEMINI_API_KEY:${gemini.api.key.1:}}
gemini.api.key.1=${GEMINI_API_KEY_1:}
gemini.api.key.2=${GEMINI_API_KEY_2:}
gemini.api.key.3=${GEMINI_API_KEY_3:}
gemini.api.key.4=${GEMINI_API_KEY_4:}
gemini.api.key.5=${GEMINI_API_KEY_5:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
gemini.embedding.dimension=${GEMINI_EMBEDDING_DIMENSION:3072}

# Logging
logging.level.root=INFO
logging.level.com.speak2hr=DEBUG
logging.level.org.springframework.data.mongodb=OFF
