# Spring Boot Server Configuration
server.port=8000
server.servlet.context-path=/

# Application Name
spring.application.name=speak2hr-backend

# MongoDB Configuration (100ms timeout for instant fallback when offline)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/speak2hr}
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.server-selection-timeout=100ms
spring.data.mongodb.connect-timeout=100ms

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Configuration
jwt.secret=speak2hr_secret_key_for_jwt_token_generation_2026_very_secure_string_key
jwt.expiration=86400000

# Google Gemini API Keys
gemini.api.key.1=${GEMINI_API_KEY_1:}
gemini.api.key.2=${GEMINI_API_KEY_2:}
gemini.api.key.3=${GEMINI_API_KEY_3:}
gemini.api.key.4=${GEMINI_API_KEY_4:}
gemini.api.key.5=${GEMINI_API_KEY_5:}
gemini.model=gemini-2.0-flash

# Logging
logging.level.root=INFO
logging.level.com.speak2hr=DEBUG
logging.level.org.springframework.data.mongodb=OFF
